<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>

<link rel="stylesheet" href="./css/base.css" />
<link rel="stylesheet" href="./css/glass.css" />
<link rel="stylesheet" href="./css/dock.css" />
<link rel="stylesheet" href="./css/motion.css" />
<link rel="stylesheet" href="./css/views.css" />
</head>
<body>

<!-- ─── Ambient wallpaper: what the glass actually refracts ─────────────── -->
<div class="wallpaper" aria-hidden="true">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="folk" aria-hidden="true"></div>
  <div class="grain"></div>
</div>

<!-- ─── Boot / splash ───────────────────────────────────────────────────── -->
<div id="boot" class="boot">
  <div class="boot-mark">
    <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
      <defs>
        <linearGradient id="bootg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7ef9d0"/><stop offset=".5" stop-color="#63b8ff"/><stop offset="1" stop-color="#b18cff"/>
        </linearGradient>
      </defs>
      <path d="M32 6 L54 46 H42 L32 27 L22 46 H10 Z" fill="url(#bootg)"/>
      <path d="M20 52 H44" stroke="url(#bootg)" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="boot-name">FOLKTRACKS</div>
  <p class="boot-tip" id="bootTip"></p>
</div>

<!-- ─── App shell ───────────────────────────────────────────────────────── -->
<div id="app" class="app" hidden>

  <header class="topbar glass glass-bar" id="topbar">
    <div class="topbar-lead">
      <div class="topbar-title" id="topTitle">Today</div>
      <div class="topbar-sub" id="topSub"></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn glass glass-chip" id="streakBtn" aria-label="Streak">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-flame"/></svg>
        <span class="badge-num" id="streakNum">0</span>
      </button>
      <button class="icon-btn glass glass-chip gear-btn" id="gearBtn" aria-label="Settings">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-gear"/></svg>
      </button>
    </div>
  </header>

  <main id="stage" class="stage"></main>

  <!-- macOS-style magnifying dock -->
  <nav class="dock-wrap" id="dockWrap">
    <div class="dock glass glass-dock" id="dock" role="tablist">
      <button class="dock-item" data-view="today" role="tab" aria-label="Today">
        <span class="dock-icon"><svg class="ic" viewBox="0 0 24 24"><use href="#i-rings"/></svg></span>
        <span class="dock-label">Today</span>
      </button>
      <button class="dock-item" data-view="diary" role="tab" aria-label="Diary">
        <span class="dock-icon"><svg class="ic" viewBox="0 0 24 24"><use href="#i-book"/></svg></span>
        <span class="dock-label">Diary</span>
      </button>
      <button class="dock-item dock-item-primary" data-action="add" role="tab" aria-label="Add food">
        <span class="dock-icon"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg></span>
        <span class="dock-label">Add</span>
      </button>
      <button class="dock-item" data-view="progress" role="tab" aria-label="Progress">
        <span class="dock-icon"><svg class="ic" viewBox="0 0 24 24"><use href="#i-chart"/></svg></span>
        <span class="dock-label">Progress</span>
      </button>
      <button class="dock-item" data-view="train" role="tab" aria-label="Train">
        <span class="dock-icon"><svg class="ic" viewBox="0 0 24 24"><use href="#i-dumbbell"/></svg></span>
        <span class="dock-label">Train</span>
      </button>
      <div class="dock-reflection" aria-hidden="true"></div>
    </div>
  </nav>

  <div id="panelRoot" class="panel-root"></div>
  <div id="sheetRoot" class="sheet-root"></div>
  <div id="toastRoot" class="toast-root" role="status" aria-live="polite"></div>
</div>

<!-- ─── Icon sprite ─────────────────────────────────────────────────────── -->
<svg style="display:none" aria-hidden="true"><defs>
  <g id="i-rings"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="2.1"/></g>
  <g id="i-book"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19a1 1 0 0 1 1 1v13.5a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 0 4 21z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M8 8h8M8 12h5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></g>
  <g id="i-plus"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></g>

  <g id="i-camera"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-1.7a1.5 1.5 0 0 1 1.3-.8h5a1.5 1.5 0 0 1 1.3.8l1 1.7h1.7A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/></g>
  <g id="i-flame"><path d="M12 2.8s5.6 4.3 5.6 9.1a5.6 5.6 0 1 1-11.2 0c0-2 1-3.6 1.9-4.6.1 1.5.9 2.4 1.8 2.4 1.2 0 1.9-1.1 1.9-3.1 0-1.5 0-2.7 0-3.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></g>
  <g id="i-search"><circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.8 15.8L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
  <g id="i-scan"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 12h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
  <g id="i-back"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="i-close"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></g>
  <g id="i-check"><path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="i-chevron"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="i-drop"><path d="M12 3.2s5.4 6 5.4 9.8a5.4 5.4 0 1 1-10.8 0C6.6 9.2 12 3.2 12 3.2z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></g>
  <g id="i-scale"><rect x="3.6" y="5.4" width="16.8" height="13.2" rx="3.4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8.4 15.2a3.6 3.6 0 0 1 7.2 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 15.2l2.4-3.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
  <g id="i-trash"><path d="M4.5 6.5h15M9.5 6.5V4.8A1.3 1.3 0 0 1 10.8 3.5h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7M7 6.5l.8 12.2A1.5 1.5 0 0 0 9.3 20h5.4a1.5 1.5 0 0 0 1.5-1.3L17 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="i-star"><path d="M12 3.4l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.4l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></g>
  <g id="i-bolt"><path d="M13.5 2.8L5.6 13.4h5.2l-.9 7.8 8.1-10.9h-5.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></g>
  <g id="i-clock"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 7.2V12l3.2 2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></g>
  <g id="i-user"><circle cx="12" cy="8.2" r="3.7" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M4.8 20.2c.8-3.7 3.7-5.8 7.2-5.8s6.4 2.1 7.2 5.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></g>

  <g id="i-moon"><path d="M20 14.4A8.6 8.6 0 0 1 9.6 4 8.6 8.6 0 1 0 20 14.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></g>

  <g id="i-shield"><path d="M12 3.2l7 2.6v5.4c0 4.3-2.9 8.1-7 9.6-4.1-1.5-7-5.3-7-9.6V5.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></g>

  <g id="i-download"><path d="M12 3.6v11M7.6 10.4L12 14.8l4.4-4.4M4.6 19.4h14.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="i-upload"><path d="M12 15.4v-11M7.6 8.6L12 4.2l4.4 4.4M4.6 19.4h14.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="i-sparkle"><path d="M12 3l1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M18.5 15.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></g>
  <g id="i-copy"><rect x="8.4" y="8.4" width="11.2" height="11.2" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.6 5.4A2 2 0 0 0 13.6 4H6.4A2.4 2.4 0 0 0 4 6.4v7.2a2 2 0 0 0 1.4 1.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>

<script type="module" src="./js/app.js"></script>
</body>
</html>
